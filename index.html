  padding: 22px 0 8px;
  font-size: 12px;
  color: #a48db5;
  margin-top: 22px;
}
.collection-link > span {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 5px;
}
.centered {
  text-align: center;
}
.modal-overlay {
  position: absolute;
  inset: 0;
  background: #35274455;
  backdrop-filter: blur(3px);
  z-index: 30;
  display: flex;
  align-items: flex-end;
  animation: fadein 0.2s;
}
.sheet {
  position: relative;
  background: #fff;
  border-radius: 25px 25px 0 0;
  width: 100%;
  padding: 31px 22px 30px;
  max-height: 91%;
  overflow: auto;
  scrollbar-width: none;
  box-shadow: 0 -10px 60px #4026501a;
  animation: slideup 0.25s ease-out;
}
.sheet-handle {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  height: 4px;
  width: 33px;
  border-radius: 5px;
  background: #dfd5e8;
}
.sheet-close {
  position: absolute;
  right: 9px;
  top: 15px;
  color: #b19cbe;
}
.sheet h2 {
  font-size: 19px;
  line-height: 1.6;
  margin: 9px 0 12px;
  letter-spacing: -0.5px;
}
.sheet > .muted {
  margin-bottom: 22px;
}
.sheet form > .muted {
  margin-bottom: 20px;
}
.sheet h4 {
  font-size: 12px;
  color: #aa94b8;
  margin: 22px 0 12px;
}
.publish-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px 12px;
  margin: 13px 0;
  border: 1px solid #eee6f6;
  border-radius: 13px;
  text-align: left;
}
.publish-option > span {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  flex-shrink: 0;
}
.publish-option > div {
  flex: 1;
}
.publish-option b {
  font-size: 13px;
  color: #877292;
}
.publish-option p {
  font-size: 9px;
  color: #b2a0be;
  margin-top: 5px;
}
.publish-option > svg {
  color: #bda9cb;
}
.form-field {
  display: block;
  color: #a58dae;
  font-size: 11px;
  margin: 18px 0;
}
.form-field input,
.form-field textarea,
.form-field select {
  display: block;
  width: 100%;
  border: 1px solid #eae0f3;
  background: #faf7fd;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  font-size: 12px;
  color: #8d739d;
  line-height: 1.6;
}
.form-field input::placeholder,
.form-field textarea::placeholder {
  color: #c2b1cd;
  font-size: 10px;
}
.form-field textarea {
  resize: vertical;
  min-height: 90px;
}
.upload {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 9px;
  background: #faf7fd;
  border: 1px dashed #decee9;
  border-radius: 12px;
  height: 133px;
  color: #b69ac9;
  margin: 19px 0;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.upload b {
  font-size: 11px;
  font-weight: 400;
}
.upload small {
  font-size: 8px;
  color: #c4b0d1;
}
.upload input {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  cursor: pointer;
}
.upload img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #aa91ba;
  margin: 20px 0 30px;
}
.checkbox-label input {
  accent-color: var(--purple);
}
.review-illustration {
  display: flex;
  justify-content: center;
  gap: 5px;
  color: #b299d2;
  margin: 17px;
}
.rating-stars {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 26px 0;
  color: #ddba8e;
}
.toast {
  position: absolute;
  z-index: 50;
  left: 20px;
  right: 20px;
  top: 60px;
  background: #51435ded;
  color: white;
  padding: 12px 15px;
  border-radius: 12px;
  box-shadow: 0 8px 30px #40294722;
  display: flex;
  gap: 9px;
  align-items: center;
  font-size: 11px;
  line-height: 1.7;
  animation: fadein 0.2s;
  backdrop-filter: blur(10px);
}
@keyframes fadein {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes slideup {
  from {
    transform: translateY(35px);
    opacity: 0.5;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
@media (min-width: 800px) and (min-height: 1000px) {
  .phone {
    height: 844px;
  }
  .desktop-stage {
    padding: 26px 16px 18px;
  }
  .desktop-caption {
    margin-bottom: 20px;
  }
  .desktop-foot {
    margin-top: 18px;
  }
}
@media (max-width: 500px) {
  body {
    background: #fff;
  }
  .desktop-stage {
    padding: 0;
    display: block;
    min-height: 100dvh;
    background: #fff;
  }
  .desktop-caption,
  .desktop-foot {
    display: none;
  }
  .phone {
    width: 100%;
    height: 100dvh;
    min-height: 0;
    max-height: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .status-bar {
    height: calc(38px + env(safe-area-inset-top));
    min-height: calc(38px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
  }
  .dynamic-island {
    display: none;
  }
  .tabbar {
    height: calc(70px + env(safe-area-inset-bottom));
    min-height: calc(70px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet {
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  .sticky-actions,
  .chat-composer {
    padding-bottom: calc(23px + env(safe-area-inset-bottom));
  }
  .home-indicator {
    bottom: max(5px, env(safe-area-inset-bottom));
  }
  .home-intro {
    padding-top: 22px;
    padding-bottom: 19px;
  }
  .home-intro h1 {
    font-size: 29px;
  }
  .intro-art {
    right: 14px;
  }
  .post-cover > img {
    height: 202px;
  }
  .masonry-col:nth-child(2) .post-card:nth-child(odd) .post-cover > img {
    height: 176px;
  }
  .post-title {
    font-size: 12px;
  }
}
.banner-people {
  display: flex;
  align-items: center;
  gap: 3px;
}
.banner-people img {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid white;
}
.banner-people img + img {
  margin-left: -7px;
  margin-right: 3px;
}
.skill-thumb {
  width: 34px;
  height: 34px;
  border-radius: 10px;
}
.skill-description {
  font-size: 9px;
  color: #aa96b8;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 3px 0;
}
.app-scroll > .page-pad,
.app-scroll > .brand-header {
  animation: fadein 0.22s ease;
}
.post-cover {
  background: #eee9f3;
}
@media (min-width: 501px) and (max-height: 760px) {
  .desktop-stage {
    padding: 12px;
  }
  .desktop-caption {
    margin-bottom: 10px;
  }
  .desktop-foot {
    margin-top: 10px;
  }
  .phone {
    min-height: 0;
    height: calc(100dvh - 88px);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
